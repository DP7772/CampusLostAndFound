[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# 1. API routes (Top priority: ye functions ko hit karega)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2. Frontend routes (Dashboards aur baaki pages 404 nahi denge)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# MIME type fix
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"
